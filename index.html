<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFE OS">
<meta name="theme-color" content="#2F5D50">
<title>LIFE OS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5D50'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='%23FAF6F0' font-family='Georgia,serif' font-weight='bold'%3EL%3C/text%3E%3Ccircle cx='46' cy='18' r='6' fill='%23E07A5F'/%3E%3C/svg%3E">
<!-- iOS accepteert alleen een echt PNG-bestand als home-screen-icoon (geen SVG/data-URL);
     zonder dit bestand valt iOS terug op een pagina-screenshot als icoon. -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Palet uit het design system; --grijs is gedonkerd van #6B7572 naar #67706D
     (4,74:1 op crème — WCAG AA; het origineel haalde 4,42:1 en faalde net).
     --terra blijft de accentkleur voor decoratie; tekstdragende terracotta
     gebruikt --terra-diep #AF5F4A (4,6:1 met wit — #E07A5F haalde maar 2,95:1). */
  --groen:#2F5D50; --terra:#E07A5F; --terra-diep:#AF5F4A; --creme:#FAF6F0; --lichtgroen:#EAF1EE;
  --inkt:#26302D; --grijs:#67706D;
  --rood:#F8D7DA; --amber:#FFE8C9; --oke:#D9EAD3;
  --rood-t:#8f3a42; --amber-t:#8a5a17; --oke-t:#3d6b34;
  --radius:14px; --tabbar-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
/* scroll-padding: gefocuste elementen nooit achter de vaste tab-bar (WCAG 2.4.11) */
html{font-size:16px;background:var(--creme);scroll-padding-bottom:calc(var(--tabbar-h) + 16px)}
body{
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--creme); color:var(--inkt); line-height:1.5;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));
}
h1,h2,h3{font-family:'Lora',Georgia,serif;color:var(--groen)}
h1{font-size:1.5rem} h2{font-size:1.15rem;margin-bottom:.6rem} h3{font-size:1rem}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:.9rem}
input,select,textarea{
  font-family:inherit;font-size:16px;padding:.55rem .7rem;border:1px solid #d8d2c8;
  border-radius:10px;background:#fff;color:var(--inkt);max-width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--groen);outline-offset:1px}
.app{display:flex;min-height:100vh}
/* ---------- sidebar (desktop) ---------- */
.sidebar{display:none}
@media(min-width:900px){
  body{padding-bottom:0}
  .sidebar{
    display:block;width:220px;flex-shrink:0;
    background:var(--groen);color:#fff;padding:1.2rem .8rem;min-height:100vh;
    position:sticky;top:0;height:100vh;
  }
  .sidebar nav{display:flex;flex-direction:column;gap:.25rem}
  .sidebar .brand{font-family:'Lora',serif;font-size:1.35rem;color:#fff;padding:.3rem .6rem 1rem}
  .sidebar .brand span{color:var(--terra)}
  .side-btn{
    display:flex;align-items:center;gap:.6rem;background:transparent;color:#e8efec;
    padding:.65rem .7rem;text-align:left;font-size:.92rem;min-height:44px;width:100%;
  }
  .side-btn:hover{background:rgba(255,255,255,.08)}
  .side-btn.active{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
  .tabbar{display:none!important}
}
main{flex:1;max-width:820px;margin:0 auto;padding:1rem;width:100%}
@media(min-width:900px){main{padding:1.6rem 2rem}}
/* ---------- bottom tab bar (mobiel) ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;
  background:#fff;border-top:1px solid #e5dfd5;
  padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px));
}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  background:none;color:var(--grijs);font-size:.62rem;min-height:44px;padding:.35rem 0;border-radius:0;
}
.tab-btn .ico{font-size:1.25rem;line-height:1}
.tab-btn.active{color:var(--groen);font-weight:600}
/* ---------- meer-sheet ---------- */
.sheet-backdrop{position:fixed;inset:0;background:rgba(38,48,45,.4);z-index:50;display:none}
.sheet-backdrop.open{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:51;background:#fff;
  border-radius:18px 18px 0 0;padding:1rem 1rem calc(1.2rem + env(safe-area-inset-bottom,0px));
  transform:translateY(105%);transition:transform .2s ease;
}
.sheet.open{transform:translateY(0)}
.sheet button{display:flex;align-items:center;gap:.7rem;width:100%;background:var(--lichtgroen);
  color:var(--inkt);padding:.85rem 1rem;margin-top:.5rem;font-size:1rem;min-height:48px}
/* ---------- kaarten & tegels ---------- */
.tab{display:none}
.tab.active{display:block;animation:fade .15s ease}
@keyframes fade{from{opacity:.4}to{opacity:1}}
.card{background:#fff;border-radius:var(--radius);padding:1rem;margin-bottom:1rem;box-shadow:0 1px 3px rgba(38,48,45,.06)}
.card.soft{background:var(--lichtgroen);box-shadow:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.7rem;margin-bottom:1rem}
.tile{background:#fff;border-radius:var(--radius);padding:.85rem .9rem;box-shadow:0 1px 3px rgba(38,48,45,.06)}
.tile .lbl{font-size:.68rem;color:var(--grijs);text-transform:uppercase;letter-spacing:.04em}
.tile .val{font-size:1.6rem;font-weight:700;color:var(--groen);font-family:'Lora',serif}
.tile .val small{font-size:.9rem;color:var(--grijs);font-weight:400}
.tile.warn .val{color:var(--rood-t)}
.datekop{margin-bottom:1rem}
.datekop .sub{color:var(--grijs);font-size:.85rem}
/* ---------- badges / status ---------- */
.badge{display:inline-block;font-size:.68rem;font-weight:600;padding:.15rem .55rem;border-radius:999px;vertical-align:middle}
.b-rood{background:var(--rood);color:var(--rood-t)}
.b-amber{background:var(--amber);color:var(--amber-t)}
.b-groen{background:var(--oke);color:var(--oke-t)}
.b-terra{background:var(--terra-diep);color:#fff}
.b-veg{background:var(--oke);color:var(--oke-t)}
.b-grijs{background:#eee9e0;color:var(--grijs)}
/* ---------- lijsten & rijen ---------- */
.rij{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid #f0ebe2}
.rij:last-child{border-bottom:none}
.rij .groei{flex:1;min-width:0}
.rij .titel{font-weight:500}
.rij .sub{font-size:.78rem;color:var(--grijs)}
.rij.klaar .titel{text-decoration:line-through;color:var(--grijs);font-weight:400}
.knop{background:var(--groen);color:#fff;padding:.6rem 1rem;font-weight:600;min-height:44px}
.knop:hover{background:#254c41}
.knop.terra{background:var(--terra-diep)}
.knop.terra:hover{background:#97503d}
.knop.licht{background:var(--lichtgroen);color:var(--groen)}
.knop.klein{padding:.35rem .7rem;min-height:44px;font-size:.8rem}
.knop.gevaar{background:var(--rood);color:var(--rood-t)}
.iconbtn{background:var(--lichtgroen);color:var(--groen);width:44px;height:44px;min-width:44px;
  font-size:1.15rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.iconbtn.mini{width:44px;height:44px;min-width:44px}
.del{background:none;color:#a39c90;font-size:1.15rem;width:44px;height:44px;min-width:44px}
.del:hover{color:var(--rood-t)}
.chk{width:24px;height:24px;min-width:24px;accent-color:var(--groen)}
.formrij{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.formrij input,.formrij select{flex:1;min-width:110px}
.formrij input[type=date]{min-width:140px}
details{border-radius:var(--radius)}
details summary{cursor:pointer;font-weight:600;color:var(--groen);padding:.3rem 0;min-height:34px;list-style:none;display:flex;align-items:center;gap:.4rem}
details summary::before{content:'▸';transition:transform .15s;color:var(--terra)}
details[open] summary::before{transform:rotate(90deg)}
.filterrij{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.filterrij button{background:#fff;color:var(--grijs);padding:.45rem .85rem;min-height:40px;font-size:.82rem;border:1px solid #e5dfd5}
.filterrij button.active{background:var(--groen);color:#fff;border-color:var(--groen);font-weight:600}
.leeg{color:var(--grijs);font-size:.88rem;padding:.6rem 0;font-style:italic}
.quickrij{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
.sessie-dots{display:inline-flex;gap:3px;vertical-align:middle}
.dot{width:12px;height:12px;border-radius:50%;background:#e8e2d8;display:inline-block}
.dot.g{background:#7aa874}.dot.f{background:#d9838b}
.statusdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#b9b2a6;margin-right:.35rem}
.statusdot.groen{background:#5c9a54}.statusdot.rood{background:#c05560}
pre.sql{background:#26302D;color:#d7e3dd;padding:.9rem;border-radius:10px;font-size:.72rem;overflow-x:auto;white-space:pre;line-height:1.45}
.hint{font-size:.78rem;color:var(--grijs);margin-top:.4rem}
.veldlabel{font-size:.75rem;font-weight:600;color:var(--grijs);text-transform:uppercase;letter-spacing:.04em;display:block;margin:.7rem 0 .25rem}
.agenda-frame{width:100%;height:70vh;border:none;border-radius:var(--radius);background:#fff}
/* Native <dialog>: top layer, echte focus-trap, Escape en focus-herstel gratis. */
dialog.modal{border:none;border-radius:18px;padding:0;width:min(92vw,480px);background:#fff;color:var(--inkt)}
dialog.modal::backdrop{background:rgba(38,48,45,.45)}
dialog.modal .modal-inner{padding:1.2rem}
dialog.modal h3{margin-bottom:.6rem}
.veg-tag{color:var(--oke-t);font-weight:700;font-size:.7rem}
.quiz-vraag{font-size:1.05rem;font-weight:600;margin:.6rem 0}
.quiz-antwoord{background:var(--lichtgroen);border-radius:10px;padding:.8rem;margin:.6rem 0}
.strip{display:flex;gap:5px;align-items:flex-end;margin-top:.5rem}
.porties-groot{font-size:1.15rem;font-weight:700;min-width:2ch;text-align:center;font-family:'Lora',serif}
/* ---------- toast / undo ---------- */
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom,0px) + 12px);z-index:70;
  background:var(--inkt);color:#fff;padding:.65rem 1rem;border-radius:12px;font-size:.85rem;
  display:flex;align-items:center;gap:.8rem;max-width:min(92vw,420px);
  box-shadow:0 4px 16px rgba(38,48,45,.3);transition:opacity .2s,transform .2s;
}
@media(min-width:900px){#toast{bottom:20px}}
#toast.zichtbaar{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
#toast button{background:none;color:var(--terra);font-weight:700;padding:.3rem .5rem;min-height:36px}
input.ongeldig{border-color:#c05560;outline:2px solid #c05560;outline-offset:1px}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
:focus-visible{outline:2px solid var(--groen);outline-offset:2px}
.tabbar :focus-visible,.sidebar :focus-visible{outline-color:var(--terra)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">LIFE<span>·</span>OS</div>
    <nav id="side-nav" aria-label="Hoofdmenu"></nav>
  </aside>
  <main>
    <section class="tab" id="tab-vandaag"></section>
    <section class="tab" id="tab-eten"></section>
    <section class="tab" id="tab-sport"></section>
    <section class="tab" id="tab-leren"></section>
    <section class="tab" id="tab-taken"></section>
    <section class="tab" id="tab-geld"></section>
    <section class="tab" id="tab-agenda"></section>
    <section class="tab" id="tab-instellingen"></section>
  </main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Hoofdnavigatie"></nav>
<div class="sheet-backdrop" id="sheet-backdrop" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<dialog class="modal" id="modal" aria-labelledby="modal-titel"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function pad(n){ return String(n).padStart(2, '0'); }
function isoOf(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
function todayISO(){ return isoOf(new Date()); }
function addDays(iso, n){ const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoOf(d); }
function daysBetween(a, b){ return Math.round((new Date(b+'T12:00:00') - new Date(a+'T12:00:00')) / 86400000); }
function daysUntil(iso){ return daysBetween(todayISO(), iso); }
function fmtDate(iso){ if(!iso) return ''; return new Date(iso+'T12:00:00').toLocaleDateString('nl-NL', {weekday:'short', day:'numeric', month:'short'}); }
function fmtDateLang(iso){ return new Date(iso+'T12:00:00').toLocaleDateString('nl-NL', {weekday:'long', day:'numeric', month:'long'}); }
/* Getrapte spacing-regel. Cepeda 2008: de optimale tussenpoos is geen vaste
   fractie maar krimpt van ~20-40% van de resterende tijd bij korte horizons
   naar ~5-10% bij een jaar. Drie treden benaderen die "ridgeline":
   25% tot 3 weken, 15% tot 3 maanden, 8% daarboven. */
function gapVoorDagen(dagen){
  const f = dagen <= 21 ? 0.25 : dagen < 90 ? 0.15 : 0.08;
  return Math.max(1, Math.round(dagen * f));
}
function weekStart(iso){ const d = new Date(iso+'T12:00:00'); const dow = (d.getDay()+6)%7; d.setDate(d.getDate()-dow); return isoOf(d); }
function isOverdue(due, done){ return !!due && !done && due < todayISO(); }
function euro(n){ return '€ ' + (Math.round(n*100)/100).toLocaleString('nl-NL', {minimumFractionDigits:2, maximumFractionDigits:2}); }
/* Floating tijden + expliciete ctz: Google pint het event dan op Nederlandse
   wandkloktijd en doet zelf de zomertijd-berekening — zonder ctz zou de tijd
   in de agenda-tijdzone van de kijker geïnterpreteerd worden. */
function gcalLink(titel, datumISO, van, tot, details){
  const d = datumISO.replace(/-/g,'');
  const dates = d + 'T' + van.replace(':','') + '00/' + d + 'T' + tot.replace(':','') + '00';
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(titel)
    + '&dates=' + dates + '&ctz=' + encodeURIComponent('Europe/Amsterdam')
    + '&details=' + encodeURIComponent(details || '');
}
/* ================= seed-data ================= */
const RONDE_NAMEN = {1:'The Basics', 2:'Comfort', 3:'World Kitchen', 4:'Fast & Fresh'};
function seedDishes(){
  const mk = (id, naam, ronde, veg, serveerMet) => ({id, naam, ronde, veg, serveerMet, porties:0, lastEaten:null});
  return [
    mk('chili','Chili con carne',1,false,'rijst'),
    mk('tikka','Kip tikka masala',1,false,'rijst'),
    mk('bolognese','Bolognese',1,false,'pasta'),
    mk('thaicurry','Thaise rode curry met kip',1,false,'rijst'),
    mk('gehaktbal','Gehaktballetjes in tomatensaus',2,false,'pasta'),
    mk('pulled','BBQ pulled chicken',2,false,'wraps'),
    mk('dal','Rode linzen-dal',2,true,'rijst'),
    mk('goulash','Hongaarse goulash',2,false,'puree'),
    mk('sate','Kip-satéstoof',3,false,'rijst'),
    mk('fajita','Mexicaanse fajita-kip',3,false,'wraps'),
    mk('kikker','Kikkererwten-spinaziecurry',3,true,'rijst'),
    mk('hachee','Hachee',3,false,'puree'),
    mk('teriyaki','Teriyaki-kip',4,false,'noedels'),
    mk('sincarne','Chili sin carne',4,true,'rijst'),
    mk('cacciatore','Kip cacciatore',4,false,'pasta'),
    mk('pinda','Pindastoof met zoete aardappel',4,true,'rijst'),
  ];
}
function seedLijst(items){ return items.map(item => ({item, checked:false})); }
function seedGrocery(){
  return {
    staples: seedLijst(['Tomatenblokjes (6+ blikken)','Passata','Tomatenpuree','Kidneybonen','Zwarte bonen','Kikkererwten (blik)','Linzen (blik)','Maïs','Kokosmelk (3+)','Rijst','Pasta','Rode linzen (droog)','Bloem','Maizena','Paneermeel','Noedels','Sojasaus','Ketjap manis','Sambal','Rode currypasta','Pindakaas','Ketchup','Honing','Azijn','Olie','Bouillonblokjes (3 soorten)','Paprikapoeder (gewoon + gerookt)','Komijn','Kerriepoeder','Garam masala','Kurkuma','Oregano','Italiaanse kruiden','Chilipoeder','Laurier','Kruidnagel','Diepvries spinazie','Diepvries sperziebonen','Diepvries broccoliroosjes']),
    r1: seedLijst(['3 uien','1 bol knoflook','2 rode paprika’s','1 winterpeen','Bleekselderij (optioneel)','Gember','1 limoen','500 g rundergehakt','500 g half-om-half gehakt','1,1 kg kippendij','200 ml kookroom']),
    r2: seedLijst(['5 uien','Knoflook','2 paprika’s','Gember','1 citroen','500 g half-om-half gehakt','600 g kippendij','600 g riblappen','1 ei']),
    r3: seedLijst(['6 uien','Knoflook','2 paprika’s','Gember','1 limoen','1 citroen','1,2 kg kippendij/kipfilet','600 g hacheevlees','Ontbijtkoek (1 plak)','Gefruite uitjes']),
    r4: seedLijst(['4 uien','Knoflook','2 rode paprika’s','250 g champignons','600 g zoete aardappel','Gember','1,2 kg kippendij']),
  };
}
const KOOKDAG_STAPPEN = [
  ['0:00','Sudderaar eerst: stoofvlees aanbraden, uien erbij, opzetten op laagste vuur'],
  ['0:25','Al het snijwerk voor de andere 3 gerechten — per gerecht in bakjes'],
  ['0:45','Gerecht 2 (langste pruttelaar) op het vuur'],
  ['1:10','Gerecht 3 op; tussendoor roeren en alvast afwassen'],
  ['1:45','Gerecht 4 (snelste) in de vrijgekomen pan'],
  ['2:15','Alles afmaken en proeven'],
  ['2:15–2:45','Portioneren in platte zakken, labelen (gerecht + datum), plat invriezen op een bakplaat'],
  ['Volgende dag','Tegels rechtop zetten en voorraad in de app bijwerken'],
];
const TECHNIEKEN = ['Retrieval','Spaced review','Interleaved oefenen','Self-explanation','Dual coding','Herlezen (betrapt)'];
const DOMEINEN = ['School','Werk','Business','Thuis'];
/* ================= store ================= */
const KEY = 'lifeos_v1';
const SCHEMA_VERSION = 2;
const COLLECTIONS = ['settings','freezer','grocery','training','study','tasks','money'];
function defaults(){
  return {
    settings: {name:'', weekGoal:3, cycleDays:16, supabaseUrl:'', supabaseKey:'', gcalEmbedSrc:'', updated_at:''},
    freezer: {dishes: seedDishes(), lastCookDate:null, nextRound:1, cookdayChecked:[false,false,false,false,false,false,false,false], updated_at:''},
    grocery: {lists: seedGrocery(), updated_at:''},
    training: {log: [], updated_at:''},
    study: {vakken: [], items: [], sessions: [], updated_at:''},
    tasks: {list: [], updated_at:''},
    money: {monthly: [], business: {omzet:0, uitgaven:0}, updated_at:''},
  };
}
let S = load();
/* Migratie: elke laadbeurt door dezelfde normalisatie, zodat oudere data-versies
   en synced data van andere apparaten altijd een geldig schema opleveren.
   Seed-gerechten worden per id gemerged: nieuwe gerechten komen erbij,
   porties/lastEaten van de gebruiker blijven staan. */
function migrate(st){
  const def = defaults();
  for(const k of COLLECTIONS){
    if(!st[k] || typeof st[k] !== 'object') st[k] = def[k];
  }
  const perId = new Map((st.freezer.dishes || []).map(d => [d.id, d]));
  st.freezer.dishes = seedDishes().map(seed => {
    const eigen = perId.get(seed.id);
    return eigen ? Object.assign({}, seed, {porties:Math.max(0, Number(eigen.porties)||0), lastEaten:eigen.lastEaten||null}) : seed;
  });
  if(!Array.isArray(st.freezer.cookdayChecked) || st.freezer.cookdayChecked.length !== 8)
    st.freezer.cookdayChecked = def.freezer.cookdayChecked;
  if(![1,2,3,4].includes(st.freezer.nextRound)) st.freezer.nextRound = 1;
  if(!st.grocery.lists) st.grocery.lists = seedGrocery();
  for(const l of ['staples','r1','r2','r3','r4'])

/* ================= supabase-sync (fetch, geen SDK) ================= */
let syncStatus = {state:'lokaal', msg:''}; /* lokaal | gesynct | fout */
function sbCfg(){
  const u = (S.settings.supabaseUrl||'').trim().replace(/\/+$/,'');
  const k = (S.settings.supabaseKey||'').trim();
  return (u && k) ? {u, k} : null;
}
function sbHeaders(k){
  return {'apikey':k, 'Authorization':'Bearer '+k, 'Content-Type':'application/json'};
}
function setSync(state, msg){
  syncStatus = {state, msg: msg||''};
  const dot = $('#sync-dot'); const txt = $('#sync-txt');
  if(dot){ dot.className = 'statusdot ' + (state==='gesynct'?'groen':state==='fout'?'rood':''); }
  if(txt){ txt.textContent = state==='gesynct' ? 'Gesynct met Supabase' : state==='fout' ? ('Sync-fout: '+msg) : 'Alleen lokaal opgeslagen'; }
}
/* Push-strategie: per collectie gedebounced (snel doorklikken = één upsert),
   10s-timeout via AbortController, 3 pogingen met exponentiële backoff,
   en een dirty-set die opnieuw gepusht wordt zodra de verbinding terugkomt. */
const syncTimers = {};
const dirty = new Set();
function syncPush(coll){
  const cfg = sbCfg(); if(!cfg) return;
  dirty.add(coll);
  clearTimeout(syncTimers[coll]);
  syncTimers[coll] = setTimeout(() => doPush(coll, 0), 600);
}
function doPush(coll, poging){
  const cfg = sbCfg(); if(!cfg) return;
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 10000);
  fetch(cfg.u + '/rest/v1/lifeos?on_conflict=id', {
    method:'POST',
    headers: Object.assign(sbHeaders(cfg.k), {'Prefer':'resolution=merge-duplicates,return=minimal'}),
    body: JSON.stringify({id:coll, data:S[coll], updated_at:S[coll].updated_at}),
    signal: ctrl.signal,
  }).then(r => {
    clearTimeout(to);
    if(r.ok){ dirty.delete(coll); setSync('gesynct'); }
    /* alleen retryen bij tijdelijke fouten (408/429/5xx); 4xx = request fixen, niet herhalen */
    else if((r.status === 408 || r.status === 429 || r.status >= 500) && poging < 2){
      setTimeout(() => doPush(coll, poging+1), 1000 * Math.pow(2, poging) + Math.random()*500);
    }
    else setSync('fout', 'HTTP '+r.status);
  }).catch(e => {
    clearTimeout(to);
    if(poging < 2 && navigator.onLine !== false) setTimeout(() => doPush(coll, poging+1), 1000 * Math.pow(2, poging) + Math.random()*500);
    else setSync('fout', e.name === 'AbortError' ? 'timeout' : e.message);
  });
}
window.addEventListener('online', () => { for(const c of dirty) doPush(c, 0); if(sbCfg()) syncPull(); });
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible' && sbCfg()) syncPull();
});
/* lichte poll: alleen de watermark-query, elke 60 s, alleen als de app zichtbaar is */
setInterval(() => { if(sbCfg() && document.visibilityState === 'visible') syncPull(); }, 60000);
async function syncPull(){
  const cfg = sbCfg(); if(!cfg) return;
  try{
    /* Goedkope watermark-check eerst (PostgREST kent geen ETag/304): alleen de
       nieuwste updated_at ophalen; de volledige fetch alleen als er echt iets
       nieuws op de server staat. */
    const wr = await fetch(cfg.u + '/rest/v1/lifeos?select=updated_at&order=updated_at.desc&limit=1', {headers: sbHeaders(cfg.k)});
    if(wr.ok){
      const w = await wr.json();
      const serverTop = (w[0] && w[0].updated_at) || '';
      const lokaalTop = COLLECTIONS.map(k => S[k].updated_at || '').sort().pop() || '';
      if(serverTop && serverTop <= lokaalTop && dirty.size === 0){ setSync('gesynct'); return; }
    }
    const r = await fetch(cfg.u + '/rest/v1/lifeos?select=*', {headers: sbHeaders(cfg.k)});
    if(!r.ok){ setSync('fout', 'HTTP '+r.status); return; }
    const rows = await r.json();
    let changed = false;
    for(const row of rows){
      if(COLLECTIONS.includes(row.id) && row.data && row.updated_at){
        const lokaal = S[row.id].updated_at || '';
        if(row.updated_at > lokaal){ S[row.id] = row.data; S[row.id].updated_at = row.updated_at; changed = true; }
      }
    }
    /* lokaal nieuwere collecties terugpushen */
    for(const k of COLLECTIONS){
      const srv = rows.find(x => x.id === k);
      if(S[k].updated_at && (!srv || S[k].updated_at > (srv.updated_at||''))) syncPush(k);
    }
    if(changed){ S = migrate(S); persist(); renderAll(); }
    setSync('gesynct');
  }catch(e){ setSync('fout', e.message); }
}
async function testSupabase(){
  const cfg = sbCfg();
  const out = $('#sb-test-result');
  if(!cfg){ out.innerHTML = '<span class="badge b-amber">Vul eerst URL en key in</span>'; return; }
  out.textContent = 'Testen…';
  try{
    const r = await fetch(cfg.u + '/rest/v1/lifeos?select=id', {headers: sbHeaders(cfg.k)});
    if(r.ok){ out.innerHTML = '<span class="badge b-groen">Verbinding OK ✓</span>'; syncPull(); }
    else out.innerHTML = '<span class="badge b-rood">Fout: HTTP '+r.status+' (bestaat de tabel lifeos?)</span>';
  }catch(e){ out.innerHTML = '<span class="badge b-rood">Fout: '+esc(e.message)+'</span>'; }
}

let toastTimer = null;

function toast(msg, undo){
  const el = $('#toast');

  el.innerHTML = esc(msg) + (undo ? ' <button onclick="doeUndo()">Ongedaan maken</button>' : '');

/* Inline validatie: markeer het veld even i.p.v. stil niets doen. */
function eis(sel){
  const el = $(sel);
  if(el && el.value.trim()){ el.classList.remove('ongeldig'); el.removeAttribute('aria-invalid'); return el.value.trim(); }
  if(el){
    el.classList.add('ongeldig'); el.setAttribute('aria-invalid', 'true'); el.focus();
    setTimeout(() => { el.classList.remove('ongeldig'); el.removeAttribute('aria-invalid'); }, 1800);
  }
  return null;
}

function sessieResultaat(id, res){
  const it = S.study.items.find(x => x.id === id); if(!it) return;
  it.sessies = it.sessies || [];
  it.sessies.push(res);
  if(it.sessies.length > 6) it.sessies = it.sessies.slice(-6);
  it.lastSession = todayISO();
  /* Fout = korte lus (morgen opnieuw); goed = de vak-tussenpoos.
     Review nooit ná het tentamen plannen. */
  let gap = res === 'fout' ? 1 : vakGap(it.vak);
  let review = addDays(todayISO(), gap);
  const vak = S.study.vakken.find(v => v.id === it.vak);
  if(vak && vak.examDate && review >= vak.examDate && vak.examDate > todayISO())
    review = addDays(vak.examDate, -1);
  it.nextReview = review;
  save('study');
}
function overhoorQueue(){
  /* achterstallig eerst, dan laagste goed-reeks */
  return S.study.items
    .filter(it => (it.antwoord||'').length)
    .sort((a,b) => {
      const oa = a.nextReview && a.nextReview <= todayISO() ? 0 : 1;
      const ob = b.nextReview && b.nextReview <= todayISO() ? 0 : 1;
      return oa !== ob ? oa - ob : goedCount(a) - goedCount(b);
    })
    .map(it => it.id);
}

        <input id="taak-titel" placeholder="Wat moet er gebeuren?" style="flex:2">
        <select id="taak-domein">${DOMEINEN.map(d => '<option>'+d+'</option>').join('')}</select>
        <input id="taak-due" type="date">
        <button class="knop" onclick="addTaak()">+ taak</button>
      </div>
    </div>
    <div class="filterrij">
      ${['alles', ...DOMEINEN].map(f => `<button class="${taakFilter === f ? 'active':''}" onclick="taakFilter='${f}';renderTaken()">${f === 'alles' ? 'Alles' : f}</button>`).join('')}
    </div>
    <div class="card">
      ${open.length ? open.map(rij).join('') : '<div class="leeg">Geen open taken… verdacht rustig.</div>'}
    </div>
    ${klaar.length ? `<details class="card" data-key="taken-klaar"><summary>Afgerond (${klaar.length})</summary>${klaar.map(rij).join('')}</details>` : ''}`;
}
function addTaak(){
  const titel = eis('#taak-titel'); if(!titel) return;
  S.tasks.list.push({id:uid(), titel, domein:$('#taak-domein').value, due:$('#taak-due').value || '', done:false});
  save('tasks');
}
function taakKlaar(id){ const t = S.tasks.list.find(x => x.id === id); if(t){ t.done = !t.done; save('tasks'); } }
function delTaak(id){
  const t = S.tasks.list.find(x => x.id === id); if(!t) return;
  S.tasks.list = S.tasks.list.filter(x => x.id !== id); save('tasks');
  toast('Taak verwijderd', () => { S.tasks.list.push(t); save('tasks'); });
}
/* ================= Geld ================= */
function renderGeld(){
  const m = S.money.monthly;
  const totaal = m.reduce((s,x) => s + Number(x.bedrag || 0), 0);
  const vast = m.filter(x => x.vast).reduce((s,x) => s + Number(x.bedrag || 0), 0);
  const b = S.money.business;
  const netto = Number(b.omzet||0) - Number(b.uitgaven||0);
  $('#tab-geld').innerHTML = `
    <div class="datekop"><h1>Geld</h1><div class="sub">Maandkosten + business — bewust klein in v1</div></div>
    <div class="tiles">
      <div class="tile"><div class="lbl">Maandkosten totaal</div><div class="val">${euro(totaal)}</div></div>
      <div class="tile"><div class="lbl">Waarvan vast</div><div class="val">${euro(vast)}</div></div>
      <div class="tile ${netto < 0 ? 'warn':''}"><div class="lbl">Business netto (mnd)</div><div class="val">${euro(netto)}</div></div>
    </div>
    <div class="card"><h2>Maandkosten</h2>
      ${m.length ? m.map((x,i) => `<div class="rij">
        <div class="groei"><div class="titel">${esc(x.item)}</div>
        <div class="sub">${x.vast ? '<span class="badge b-grijs">vast</span>' : '<span class="badge b-amber">variabel</span>'}</div></div>
        <strong>${euro(Number(x.bedrag||0))}</strong>
        <button class="del" onclick="delKost(${i})" aria-label="verwijderen">×</button>
      </div>`).join('') : '<div class="leeg">Nog geen kostenposten. Denk: huur, boodschappen, telefoon, sport, verzekeringen, abonnementen.</div>'}
      <div class="formrij">
        <input id="kost-item" placeholder="Kostenpost" style="flex:2">
        <input id="kost-bedrag" type="number" step="0.01" min="0" placeholder="€" style="width:100px">
        <select id="kost-vast"><option value="1">vast</option><option value="0">variabel</option></select>
        <button class="knop" onclick="addKost()">+ post</button>
      </div>
    </div>
    <div class="card"><h2>Business deze maand</h2>
      <div class="formrij" style="align-items:flex-end">
        <label style="flex:1;font-size:.8rem">Omzet<br><input type="number" step="0.01" min="0" value="${b.omzet||0}" onchange="setBusiness('omzet',this.value)" style="width:100%"></label>
        <label style="flex:1;font-size:.8rem">Uitgaven<br><input type="number" step="0.01" min="0" value="${b.uitgaven||0}" onchange="setBusiness('uitgaven',this.value)" style="width:100%"></label>
      </div>
      <p style="margin-top:.6rem">Netto: <strong style="color:${netto >= 0 ? 'var(--groen)' : 'var(--rood-t)'}">${euro(netto)}</strong></p>
      <div class="hint">Handmatig bijhouden; automatische Gumroad/Etsy-koppeling is v2.</div>
    </div>`;
}
function addKost(){
  const item = eis('#kost-item'); if(!item) return;
  S.money.monthly.push({item, bedrag:Number($('#kost-bedrag').value)||0, vast:$('#kost-vast').value === '1'});
  save('money');
}
function delKost(i){
  const [x] = S.money.monthly.splice(i, 1); save('money');
  if(x) toast('Kostenpost verwijderd', () => { S.money.monthly.splice(i, 0, x); save('money'); });
}
function setBusiness(k, v){ S.money.business[k] = Number(v)||0; save('money'); }
/* ================= Agenda ================= */
function renderAgenda(){
  const src = (S.settings.gcalEmbedSrc||'').trim();
  const isFile = location.protocol === 'file:';
  let inhoud;
  if(src && !isFile){
    inhoud = `<iframe class="agenda-frame" src="${esc(src)}" title="Google Agenda"></iframe>
      <div class="hint">Laadt de agenda niet? Een privé-agenda vereist Google-login in deze browser; in de beginscherm-app op iOS blokkeert Apple die cookies — zet de agenda dan op "openbaar (alleen vrij/bezet of details)" in Google Agenda, of gebruik de knop hieronder.</div>
      <div class="formrij"><a class="knop licht" style="text-decoration:none" href="https://calendar.google.com" target="_blank" rel="noopener noreferrer">Open Google Agenda ↗</a></div>`;
  } else {
    inhoud = `<div class="card soft" style="text-align:center;padding:2rem 1rem">
      <p style="margin-bottom:.8rem">${isFile ? 'De agenda-embed werkt niet op een lokaal geopend bestand (file://).' : 'Nog geen embed-URL ingesteld — zie Instellingen → Google Agenda.'}</p>
      <a class="knop" style="text-decoration:none" href="https://calendar.google.com" target="_blank" rel="noopener noreferrer">Open Google Agenda ↗</a>
    </div>`;
  }
  const kook = volgendeKookdatum() || todayISO();
  $('#tab-agenda').innerHTML = `
    <div class="datekop"><h1>Agenda</h1><div class="sub">Google Agenda + snelle event-links</div></div>
    ${inhoud}
    <div class="card"><h2>Nieuw event</h2>
      <input id="ev-titel" placeholder="Titel" style="width:100%">
      <div class="formrij">
        <input type="date" id="ev-datum" value="${todayISO()}">
        <input type="time" id="ev-van" value="19:00">
        <input type="time" id="ev-tot" value="20:00">
      </div>
      <input id="ev-notitie" placeholder="Notitie (optioneel)" style="width:100%;margin-top:.5rem">
      <div class="formrij"><button class="knop" onclick="maakEvent()">Open in Google Agenda ↗</button></div>
    </div>
    <div class="card"><h2>Snelkoppelingen</h2>
      <div class="formrij">
        <a class="knop licht" style="text-decoration:none" target="_blank" rel="noopener noreferrer"
          href="${gcalLink('Kookronde '+S.freezer.nextRound+' — '+RONDE_NAMEN[S.freezer.nextRound], kook, '14:00','16:30','LIFE OS kookdag — draaiboek staat in de app.')}">🍳 Kookronde (2½ u)</a>
        <a class="knop licht" style="text-decoration:none" target="_blank" rel="noopener noreferrer"
          href="${gcalLink('Training', addDays(todayISO(),1), '17:00','18:00','Gepland via LIFE OS.')}">🏋️ Training (morgen)</a>
      </div>
      <div class="hint">Spacing-momenten plan je vanuit de Leren-tab.</div>
    </div>`;
}
function maakEvent(){
  const titel = $('#ev-titel').value.trim() || 'Nieuw event';
  const datum = $('#ev-datum').value || todayISO();
  const van = $('#ev-van').value || '19:00';
  const tot = $('#ev-tot').value || '20:00';
  window.open(gcalLink(titel, datum, van, tot, $('#ev-notitie').value.trim()), '_blank', 'noopener,noreferrer');
}
/* ================= Instellingen ================= */
const SB_SQL = `create table if not exists lifeos (
  id text primary key,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table lifeos enable row level security;
-- Let op: iedereen met jouw project-URL + anon key kan lezen/schrijven.
-- Prima voor persoonlijk gebruik zolang je de URL/keys niet publiek deelt.
create policy "anon all" on lifeos for all using (true) with check (true);`;
function renderInstellingen(){
  $('#tab-instellingen').innerHTML = `
    <div class="datekop"><h1>Instellingen</h1></div>
    <div class="card"><h2>Profiel</h2>
      <label class="veldlabel" for="set-naam">Naam</label>
      <input id="set-naam" value="${esc(S.settings.name)}" onchange="setSetting('name',this.value)" style="width:100%;max-width:300px">
    </div>
    <div class="card"><h2>Supabase-sync</h2>
      <p style="font-size:.85rem"><span class="statusdot ${syncStatus.state==='gesynct'?'groen':syncStatus.state==='fout'?'rood':''}" id="sync-dot"></span><span id="sync-txt">${syncStatus.state==='gesynct'?'Gesynct met Supabase':syncStatus.state==='fout'?'Sync-fout: '+esc(syncStatus.msg):'Alleen lokaal opgeslagen'}</span></p>
      <label class="veldlabel" for="set-sburl">Project-URL</label>
      <input id="set-sburl" placeholder="https://xxxx.supabase.co" value="${esc(S.settings.supabaseUrl)}" onchange="setSetting('supabaseUrl',this.value)" style="width:100%">
      <label class="veldlabel" for="set-sbkey">Anon key</label>
      <input id="set-sbkey" placeholder="eyJ…" value="${esc(S.settings.supabaseKey)}" onchange="setSetting('supabaseKey',this.value)" style="width:100%">
      <div class="formrij"><button class="knop" onclick="testSupabase()">Test verbinding</button><span id="sb-test-result" style="align-self:center"></span></div>
      <details style="margin-top:.7rem" data-key="sql"><summary>Eenmalige setup: SQL voor de Supabase-editor</summary>
        <pre class="sql" id="sb-sql">${esc(SB_SQL)}</pre>
        <div class="formrij"><button class="knop klein licht" onclick="navigator.clipboard&&navigator.clipboard.writeText(document.getElementById('sb-sql').textContent)">Kopieer SQL</button></div>
      </details>
      <div class="hint">Maak gratis een project op supabase.com, plak bovenstaande SQL in de SQL-editor, en zet hier je Project-URL en anon key (Settings → API). De app werkt ook zonder — dan blijft alles alleen lokaal. Let op: wie deze URL + key heeft kan je data lezen/schrijven, dus deel het bestand niet publiek. (v2: Supabase Auth.)</div>
    </div>
    <div class="card"><h2>Google Agenda</h2>
      <label class="veldlabel" for="set-gcal">Embed-URL (src)</label>
      <input id="set-gcal" placeholder="https://calendar.google.com/calendar/embed?src=…" value="${esc(S.settings.gcalEmbedSrc)}" onchange="setSetting('gcalEmbedSrc',this.value)" style="width:100%">
      <div class="hint">Zo vind je die: Google Agenda op desktop → tandwiel → Instellingen → kies je agenda → “Agenda integreren” → kopieer uit de embed-code alleen de URL die in src="…" staat.</div>
    </div>
    <div class="card"><h2>Backup</h2>
      <div class="formrij">
        <button class="knop" onclick="exportJSON()">Exporteer JSON</button>
        <label class="knop licht" style="display:inline-flex;align-items:center;cursor:pointer">Importeer JSON
          <input type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this)"></label>
        <button class="knop gevaar" onclick="resetAll()">Reset alles</button>
      </div>
      <div class="hint">Tip: wekelijks even exporteren. iOS kan localStorage wissen als je de app extreem lang niet gebruikt.</div>
    </div>
    <div class="card soft"><h2>Over</h2>
      <p style="font-size:.85rem">LIFE OS v1 — persoonlijke app van Bink. Eén HTML-bestand: vriezer &amp; kookrondes, sport, evidence-based leren, taken, geld en agenda. Data lokaal (localStorage) + optionele Supabase-sync.</p>
    </div>`;
}
function setSetting(k, v){
  S.settings[k] = v.trim();
  save('settings');
  if(k === 'supabaseUrl' || k === 'supabaseKey'){ if(sbCfg()) syncPull(); else setSync('lokaal'); }
}
function exportJSON(){
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lifeos-backup-' + todayISO() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
}
function importJSON(input){
  const f = input.files && input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const data = JSON.parse(rd.result);
      if(!data.settings || !data.freezer) throw new Error('Geen geldig LIFE OS-bestand');
      S = migrate(data);
      for(const k of COLLECTIONS) S[k].updated_at = new Date().toISOString();
      persist(); renderAll();
      for(const k of COLLECTIONS) syncPush(k);
      toast('Import gelukt ✓');
    }catch(e){ toast('Import mislukt: ' + e.message); }
  };
  rd.readAsText(f);
}
function resetAll(){
  if(!confirm('Weet je het zeker? Dit wist ALLE lokale data (Supabase-data blijft staan).')) return;
  localStorage.removeItem(KEY);
  location.reload();
}
/* ================= render & init ================= */
/* Re-render behoudt focus (incl. cursorpositie) en scrollpositie,
   zodat opslaan-na-elke-mutatie niet stoort tijdens het typen. */
function renderAll(){
  const ae = document.activeElement;
  const focusId = ae && ae.id && !$('#modal').open ? ae.id : null;
  let sel = null;
  try{ if(focusId && ae.selectionStart != null) sel = ae.selectionStart; }catch(e){}
  const sx = window.scrollX, sy = window.scrollY;
  const openDetails = [...document.querySelectorAll('main details[open]')].map((d,i) => d.dataset.key).filter(Boolean);
  renderVandaag(); renderEten(); renderSport(); renderLeren(); renderTaken(); renderGeld(); renderAgenda(); renderInstellingen();
  for(const key of openDetails){
    const d = document.querySelector('main details[data-key="'+key+'"]');
    if(d) d.open = true;
  }
  if(focusId){
    const el = document.getElementById(focusId);
    if(el){ el.focus({preventScroll:true}); try{ if(sel != null) el.setSelectionRange(sel, sel); }catch(e){} }
  }
  window.scrollTo(sx, sy);
}
bouwNav();
renderAll();
showTab('vandaag');
if(sbCfg()) syncPull();
/* Vraag persistente opslag aan (best effort; beschermt tegen storage-eviction). */
if(navigator.storage && navigator.storage.persist){ navigator.storage.persist().catch(() => {}); }
/* voor tests & console */
window.lifeos = {gapVoorDagen, addDays, daysBetween, daysUntil, isOverdue, weekStart, volgendeKookdatum, avondetenSuggestie, get store(){ return S; }};
</script>
</body>
